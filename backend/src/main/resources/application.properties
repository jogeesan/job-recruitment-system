spring.application.name=backend
server.port=8080

# PostgreSQL (matches docker-compose.yml at the repo root)
spring.datasource.url=jdbc:postgresql://localhost:5432/recruitment
spring.datasource.username=recruitment
spring.datasource.password=recruitment

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Frontend origin allowed for CORS (see WebConfig)
app.cors.allowed-origin=http://localhost:5173
