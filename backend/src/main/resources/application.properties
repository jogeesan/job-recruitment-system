spring.application.name=backend
server.port=8080

# Local PostgreSQL Configuration
# Make sure to create the database: CREATE DATABASE recruitment_db;
spring.datasource.url=jdbc:postgresql://localhost:5432/recruitment_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Jogee1126}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Frontend origin allowed for CORS (see WebConfig)
app.cors.allowed-origin=http://localhost:5173
